name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rem-recombinator
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: rem-recombinator/requirements-dev.txt

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest
