[project]
name = "rem-recombinator"
version = "0.2.0"
description = "Provenance-tracked semantic recombination of knowledge fragments."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "anthropic>=0.40.0",
    "voyageai>=0.3.0",
    "mcp>=1.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
rem-recombinator = "rem_recombinator.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rem_recombinator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
